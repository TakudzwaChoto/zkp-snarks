name: Smoke Test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Minimal runtime deps for the app to import and run smoke test
          pip install Flask==2.3.3 Flask-Limiter==3.5.1 Flask-WTF==1.2.1 python-dotenv==1.0.0 requests==2.32.3 cryptography==41.0.7

      - name: Run smoke test
        env:
          FLASK_SECRET_KEY: dev
          SESSION_COOKIE_SECURE: 'false'
          WTF_CSRF_SSL_STRICT: 'false'
          ENABLE_AUTOGEN: 'false'
          SNARK_ENABLED: 'false'
        run: |
          make smoke

